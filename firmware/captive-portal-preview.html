<!DOCTYPE html>
<!--
  DICE Captive Portal — preview / design source

  Open this file in a browser (just double-click) to review the UI before
  porting it to the firmware C string in firmware/main/captive_portal.c.

  Aesthetic: matches frontend v5 redesign — dark mono, blueprint grid,
  bracketed labels, corner ticks, dashed rules, no green except status pills.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DICE Node · Setup</title>
<style>
  :root{
    --bg:#0a0a0a;
    --fg:#fafafa;
    --muted:#a1a1aa;
    --border:rgba(255,255,255,.10);
    --border-strong:rgba(255,255,255,.25);
    --surface:#141414;
    --ok:#4ade80;
    --warn:#facc15;
    --err:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:var(--bg);
    color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }
  body{
    padding:28px 16px 48px;
    /* blueprint grid bg — matches frontend bg-grid utility */
    background-image:
      linear-gradient(to right, rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:24px 24px;
  }
  .wrap{max-width:480px;margin:0 auto;position:relative}

  /* Top bar — [ LIVE ] · session info */
  .bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:10px;
    letter-spacing:.16em;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .bar .live{display:inline-flex;align-items:center;gap:8px}
  .bar .live::before{
    content:"";
    width:6px;height:6px;
    background:var(--ok);
    border-radius:50%;
    box-shadow:0 0 8px var(--ok);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* Heading — sans for character, mono for everything else */
  h1{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:30px;
    font-weight:500;
    letter-spacing:-0.015em;
    margin-bottom:6px;
  }
  .tagline{
    color:var(--muted);
    font-size:12.5px;
    letter-spacing:.02em;
    margin-bottom:22px;
  }
  .tagline strong{color:var(--fg);font-weight:500}

  /* ASCII rule  ── × CONFIG × ── */
  .rule{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:10px;
    color:var(--muted);
    margin:20px 0 14px;
    letter-spacing:.2em;
    text-transform:uppercase;
  }
  .rule::before,.rule::after{
    content:"";
    flex:1;
    border-top:1px dashed var(--border);
  }

  /* Stat grid — bracketed labels, mono values */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
  }
  .stat{
    background:var(--bg);
    padding:12px 14px;
  }
  .stat-label{
    font-size:9.5px;
    letter-spacing:.18em;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .stat-label::before{content:"[ "}
  .stat-label::after{content:" ]"}
  .stat-value{
    font-size:13px;
    color:var(--fg);
    font-feature-settings:"tnum" 1;
  }

  /* Form card — corner ticks, no glow, no fill */
  .card{
    border:1px solid var(--border);
    padding:22px 18px 20px;
    position:relative;
    background:var(--bg);
  }
  .card::before,.card::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    border:1px solid var(--fg);
    opacity:.45;
    pointer-events:none;
  }
  .card::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .card::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

  /* Field */
  .field{margin-bottom:16px}
  label{
    display:block;
    font-size:9.5px;
    letter-spacing:.2em;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .input-row{
    display:flex;
    align-items:stretch;
    border:1px solid var(--border);
    background:var(--bg);
    transition:border-color .12s, box-shadow .12s;
  }
  .input-row:hover{border-color:var(--border-strong)}
  .input-row:focus-within{
    border-color:var(--fg);
    box-shadow:0 0 0 1px var(--fg);
  }
  .input-row::before{
    content:">";
    color:var(--muted);
    padding:0 10px 0 12px;
    display:flex;
    align-items:center;
    font-weight:600;
  }
  .input-row input{
    flex:1;
    width:100%;
    border:0;
    background:transparent;
    color:var(--fg);
    /* 16px to suppress iOS auto-zoom on focus */
    font:inherit;
    font-size:15px;
    padding:12px 12px 12px 0;
    outline:none;
    letter-spacing:.01em;
  }
  .input-row input::placeholder{color:var(--muted);opacity:.55}

  /* Button — outlined ASCII-y look */
  .btn{
    display:block;
    width:100%;
    background:transparent;
    color:var(--fg);
    border:1px solid var(--fg);
    padding:13px 16px;
    font:inherit;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    cursor:pointer;
    margin-top:6px;
    transition:background .12s, color .12s;
  }
  .btn::before{content:"[  "}
  .btn::after{content:"  ]"}
  .btn:hover:not(:disabled){background:var(--fg);color:var(--bg)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.35;cursor:not-allowed}

  /* Result alerts — bracketed status, color = border + text */
  .result{margin-top:14px;min-height:0}
  .alert{
    padding:10px 12px;
    border:1px solid;
    font-size:12px;
    letter-spacing:.02em;
    line-height:1.45;
    display:block;
  }
  .alert::before{font-weight:600;margin-right:8px;display:inline-block;letter-spacing:.18em}
  .alert.err{color:var(--err);border-color:var(--err)}
  .alert.err::before{content:"[ ERR ]"}
  .alert.ok{color:var(--ok);border-color:var(--ok)}
  .alert.ok::before{content:"[ OK ]"}
  .alert.run{color:var(--warn);border-color:var(--warn)}
  .alert.run::before{content:"[ ... ]"}

  /* Footer */
  .foot{
    text-align:center;
    margin-top:22px;
    font-size:9.5px;
    color:var(--muted);
    letter-spacing:.22em;
    text-transform:uppercase;
    line-height:1.8;
  }
  .foot .sep{opacity:.4;margin:0 6px}

  @media (max-width:380px){
    body{padding:18px 12px 32px}
    h1{font-size:24px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="live">DEVICE LIVE</span>
    <span>NODE · INITIAL SETUP</span>
  </div>

  <h1>DICE Node</h1>
  <p class="tagline">Hardware-backed randomness. Provision your <strong>node</strong> to join the network.</p>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Device</div>
      <div class="stat-value" id="devid">DICE-····</div>
    </div>
    <div class="stat">
      <div class="stat-label">Board</div>
      <div class="stat-value">ESP32-S3-N16R8</div>
    </div>
    <div class="stat">
      <div class="stat-label">Firmware</div>
      <div class="stat-value">v1.0.0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Network</div>
      <div class="stat-value">Solana · Devnet</div>
    </div>
  </div>

  <div class="rule">× &nbsp;CONFIG&nbsp; ×</div>

  <div class="card">
    <form id="form" autocomplete="off" novalidate>
      <div class="field">
        <label for="ssid">WiFi Network</label>
        <div class="input-row">
          <input id="ssid" type="text" placeholder="ssid" maxlength="32" required>
        </div>
      </div>

      <div class="field">
        <label for="pass">WiFi Password</label>
        <div class="input-row">
          <input id="pass" type="password" placeholder="••••••••" maxlength="64" required>
        </div>
      </div>

      <div class="field">
        <label for="wallet">Solana Payout Wallet</label>
        <div class="input-row">
          <input id="wallet" type="text" placeholder="32–44 base58 chars" maxlength="44" spellcheck="false" autocapitalize="off" required>
        </div>
      </div>

      <button class="btn" id="btn" type="submit">Provision &amp; Connect</button>
      <div class="result" id="result" aria-live="polite"></div>
    </form>
  </div>

  <div class="foot">
    DICE PROTOCOL <span class="sep">·</span> v7.7<br>
    HARDWARE-BACKED VRF <span class="sep">·</span> ON-CHAIN AUDIT
  </div>
</div>

<script>
(function(){
  var btn    = document.getElementById('btn');
  var result = document.getElementById('result');
  var form   = document.getElementById('form');

  function show(cls, msg){
    result.innerHTML = '<div class="alert '+cls+'">'+msg+'</div>';
  }
  function clear(){ result.innerHTML = ''; }

  // Pull live device id (preview just leaves the placeholder)
  fetch('/info').then(function(r){return r.json();}).then(function(d){
    if (d && d.device_id) document.getElementById('devid').textContent = d.device_id;
  }).catch(function(){ /* preview mode — no /info endpoint */ });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var s = document.getElementById('ssid').value.trim();
    var p = document.getElementById('pass').value;
    var w = document.getElementById('wallet').value.trim();
    if (!s) return show('err','WiFi network required');
    if (!p) return show('err','WiFi password required');
    if (!w) return show('err','Solana wallet required');
    if (w.length < 32 || w.length > 44) return show('err','Wallet must be 32–44 base58 chars');

    btn.disabled = true;
    show('run','Testing connection to '+s+'. Up to 15 sec…');

    fetch('/save', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ssid:s, pass:p, wallet:w})
    }).then(function(r){return r.json();}).then(function(d){
      if (d.ok) show('ok','Provisioned. Rebooting in 3 sec…');
      else { show('err', d.error || 'Unknown error — try again'); btn.disabled = false; }
    }).catch(function(){
      show('err','Network dropped. Reconnect to DICE WiFi and retry.');
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>

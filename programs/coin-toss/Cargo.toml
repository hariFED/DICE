[package]
name = "coin-toss"
version = "0.1.0"
edition = "2021"
description = "Example coin-toss game using DICE VRF for provable randomness"

[lib]
crate-type = ["cdylib", "lib"]
name = "coin_toss"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
solana-program = { workspace = true }

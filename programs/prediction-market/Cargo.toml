[package]
name = "prediction-market"
version = "0.1.0"
edition = "2021"
description = "Prediction market with VRF-based fair resolution using DICE oracle"

[lib]
crate-type = ["cdylib", "lib"]
name = "prediction_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }

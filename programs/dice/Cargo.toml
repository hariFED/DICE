[package]
name    = "dice"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name       = "dice"

[features]
no-entrypoint  = []
no-idl         = []
no-log-cx      = []
cpi            = ["no-entrypoint"]
default        = []
idl-build      = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
solana-program = { workspace = true }
# Pin blake3 <1.8 and borsh <1.3 — both avoid edition2024 in the Solana BPF toolchain.
blake3               = { workspace = true }
unicode-segmentation = { workspace = true }
# borsh is NOT added here — adding borsh 1.x alongside anchor-lang's borsh 0.x
# re-exports causes E0659 "borsh is ambiguous" in AnchorDeserialize macros.

[dev-dependencies]
anchor-lang = { workspace = true }
solana-program = { workspace = true }
# k256 is dev-only — used by NodeVault binding-signature tests to produce
# real ECDSA signatures. Not included in the BPF binary.
k256        = { workspace = true }
sha2        = { workspace = true }

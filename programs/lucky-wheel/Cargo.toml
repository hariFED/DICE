[package]
name = "lucky-wheel"
version = "0.1.0"
edition = "2021"
description = "Lucky wheel with weighted segments using DICE VRF for provable randomness"

[lib]
crate-type = ["cdylib", "lib"]
name = "lucky_wheel"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    network: dice

rule_files:
  - "alerts.yml"

scrape_configs:

  - job_name: dice-coordinator
    static_configs:
      - targets: ["coordinator:9090"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

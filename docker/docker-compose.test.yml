version: "3.9"

# DICE test-only docker-compose
# Used by Phase 2 (integration) and Phase 4 (E2E) of the orchestrator.
# Infra Agent owns this file.

services:

  # ─── PostgreSQL (test instance) ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dice-test-postgres
    environment:
      POSTGRES_DB:       dice_test
      POSTGRES_USER:     dice_test
      POSTGRES_PASSWORD: testpassword
    volumes:
      - ../coordinator/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dice_test -d dice_test"]
      interval: 3s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral — wiped after each test run
    networks:
      - dice-test

  # ─── step-ca (test CA) ────────────────────────────────────────────────────
  step-ca:
    image: smallstep/step-ca:0.26.1
    container_name: dice-test-step-ca
    environment:
      DOCKER_STEPCA_INIT_NAME:      "DICE Test CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "step-ca,localhost"
    volumes:
      - step-ca-test-data:/home/step
    networks:
      - dice-test
    expose:
      - "9000"

  # ─── Coordinator (test instance — built binary mounted in) ────────────────
  coordinator:
    image: debian:bookworm-slim
    container_name: dice-test-coordinator
    command: /app/dice-coordinator
    environment:
      RUST_LOG:     "debug"
      DATABASE_URL: "postgresql://dice_test:testpassword@postgres:5432/dice_test"
      WS_PORT:      "8443"
      API_PORT:     "8080"
      # Secrets injected as env vars for test convenience only
      SOLANA_RPC_URL:       "http://solana-test-validator:8899"
      COORDINATOR_KEYPAIR:  "/app/test_keypair.json"
    volumes:
      - ../target/release/dice-coordinator:/app/dice-coordinator:ro
      - ./test-fixtures/coordinator_keypair.json:/app/test_keypair.json:ro
      - ./test-fixtures/certs:/app/certs:ro
    ports:
      - "8443:8443"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      step-ca:
        condition: service_started
    networks:
      - dice-test

  # ─── Solana test validator ─────────────────────────────────────────────────
  # Used when anchor test is not running its own validator.
  # Disabled by default; enable with --profile solana.
  solana-test-validator:
    image: anzaxyz/agave:v2.0.0
    container_name: dice-test-validator
    command: >
      solana-test-validator
      --reset
      --quiet
      --rpc-port 8899
      --faucet-port 9900
    ports:
      - "8899:8899"
      - "9900:9900"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8899/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dice-test
    profiles:
      - solana

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  step-ca-test-data:

# ─── Networks ───────────────────────────────────────────────────────────────
networks:
  dice-test:
    driver: bridge

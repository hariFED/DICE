[package]
name    = "adversarial-driver"
version = "0.1.0"
edition = "2021"
description = "Adversarial / malformed-input test runner for the DICE program. Submits crafted instructions against live devnet and verifies each is rejected with the expected error code."

[[bin]]
name = "adversarial-driver"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
sha2               = { workspace = true }
hex                = { workspace = true }
solana-sdk         = { workspace = true }
clap               = { version = "4", features = ["derive"] }
reqwest            = { version = "0.12", features = ["json"] }
base64             = "0.22"
bincode            = "1"
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DICE — Welcome Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    padding: 40px;
  }

  .card-container {
    display: flex;
    flex-direction: column;
    gap: 40px;
    align-items: center;
  }

  .label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555;
    text-align: center;
    margin-bottom: 8px;
  }

  /* === FRONT OF CARD === */
  .card-front {
    width: 500px;
    height: 300px;
    background: #000;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 120px rgba(255,255,255,0.015);
  }

  /* Subtle noise texture overlay */
  .card-front::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.03) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(255,255,255,0.02) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Thin metallic edge line */
  .card-front::after {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 10px;
    pointer-events: none;
  }

  .front-content {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .dice-logo {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 20px;
    text-transform: uppercase;
    background: linear-gradient(
      180deg,
      #ffffff 0%,
      #d4d4d4 25%,
      #a0a0a0 50%,
      #c8c8c8 75%,
      #e8e8e8 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: brightness(1.1);
    padding-right: 20px; /* compensate for letter-spacing */
  }

  .dice-subtitle {
    font-size: 10px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-top: 12px;
    font-weight: 300;
  }

  .dice-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    margin: 18px auto 16px;
  }

  .dice-edition {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.18);
    text-transform: uppercase;
  }

  /* === BACK OF CARD === */
  .card-back {
    width: 500px;
    min-height: 300px;
    background: #000;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    padding: 36px 40px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 20px 60px rgba(0,0,0,0.6);
  }

  .card-back::after {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 10px;
    pointer-events: none;
  }

  .back-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .back-logo {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #e0e0e0, #888);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .welcome-text {
    font-size: 20px;
    font-weight: 300;
    text-align: center;
    color: rgba(255,255,255,0.75);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .welcome-text em {
    font-style: normal;
    color: rgba(255,255,255,0.95);
    font-weight: 400;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .info-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    font-weight: 400;
  }

  .info-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 1px;
  }

  .back-footer {
    margin-top: 24px;
    text-align: center;
  }

  .scan-text {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.15);
    margin-top: 12px;
  }

  .qr-placeholder {
    width: 64px;
    height: 64px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 1px;
  }

  /* Print layout */
  @media print {
    body { background: #fff; padding: 0; }
    .card-front, .card-back {
      box-shadow: none;
      border: 1px solid #ccc;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    .label { display: none; }
  }
</style>
</head>
<body>

<div class="card-container">

  <!-- FRONT -->
  <div>
    <div class="label">Front</div>
    <div class="card-front">
      <div class="front-content">
        <div class="dice-logo">DICE</div>
        <div class="dice-subtitle">Cryptographic Entropy Node</div>
        <div class="dice-line"></div>
        <div class="dice-edition">VRF Oracle &middot; Solana</div>
      </div>
    </div>
  </div>

  <!-- BACK -->
  <div>
    <div class="label">Back</div>
    <div class="card-back">
      <div class="back-header">
        <div class="back-logo">DICE</div>
      </div>

      <div class="welcome-text">
        Welcome to the <em>DICE Network</em>.<br>
        Your node is ready to generate<br>
        <em>verifiable randomness</em> on Solana.
      </div>

      <div class="info-row">
        <span class="info-label">Device ID</span>
        <span class="info-value">DICE-XXXX</span>
      </div>
      <div class="info-row">
        <span class="info-label">Network</span>
        <span class="info-value">Solana</span>
      </div>
      <div class="info-row">
        <span class="info-label">Fee Per Request</span>
        <span class="info-value">0.002 SOL</span>
      </div>
      <div class="info-row" style="border-bottom: none;">
        <span class="info-label">Earnings</span>
        <span class="info-value">Sent to your Solana wallet</span>
      </div>

      <div class="back-footer">
        <div class="qr-placeholder">QR</div>
        <div class="scan-text">Scan for setup &middot; dice.network</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
